spring:
  application:
    name: dog-api-production-ready
  datasource:
    host: localhost
    port: 5433
    dbname: dog_api_production_ready_db
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.dbname}
    username: postgres
    password: password
  jpa:
    # outputs the SQL statements on the console
    show-sql: true

server:
  port: 8080

# Exposes only health and info over HTTP (safe default; do not expose everything in prod).
# Enables probe endpoints so you get:
#   /actuator/health/liveness
#   /actuator/health/readiness
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true